name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug and release APKs
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleDebug assembleRelease 2>&1 | tee build.log

      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -E "^e: |error:|> Task .*FAILED|FAILURE:|What went wrong" build.log | head -c 40000 > build-error.txt || true
          tail -c 60000 build.log > build-tail.txt
          gh release delete buildlog --cleanup-tag --yes 2>/dev/null || true
          gh release create buildlog build-error.txt build-tail.txt \
            --title "Build log (run ${{ github.run_number }})" --notes "Compile errors from the latest failed build." || \
          gh release upload buildlog build-error.txt build-tail.txt --clobber

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/Hush-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/Hush.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Hush-apk
          path: out/*.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          gh release create "$tag" out/Hush.apk out/Hush-debug.apk \
            --title "Hush build ${{ github.run_number }}" \
            --notes "Install Hush.apk on your phone. Built from ${GITHUB_SHA::7}." \
            --latest
