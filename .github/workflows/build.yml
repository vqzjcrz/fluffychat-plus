name: Build APKs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_CUSTOM_KEY: ${{ secrets.SIFT_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Optional: refresh the bundled Public Suffix List at build time.
      - name: Update Public Suffix List
        continue-on-error: true
        run: |
          curl -fsSL https://publicsuffix.org/list/public_suffix_list.dat -o /tmp/psl.dat \
            && [ "$(wc -l < /tmp/psl.dat)" -gt 10000 ] \
            && mv /tmp/psl.dat app/src/main/assets/public_suffix_list.dat

      # Optional: use your own signing key from repo secrets instead of the bundled one.
      - name: Decode signing key
        if: env.HAS_CUSTOM_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.SIFT_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIFT_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: gradle --no-daemon :app:testOfflineReleaseUnitTest

      - name: Build release APKs
        env:
          SIFT_KEYSTORE_PASSWORD: ${{ secrets.SIFT_KEYSTORE_PASSWORD }}
          SIFT_KEY_ALIAS: ${{ secrets.SIFT_KEY_ALIAS }}
          SIFT_KEY_PASSWORD: ${{ secrets.SIFT_KEY_PASSWORD }}
        run: |
          # Empty secrets would override the defaults with "", so unset them.
          [ -z "$SIFT_KEYSTORE_PASSWORD" ] && unset SIFT_KEYSTORE_PASSWORD
          [ -z "$SIFT_KEY_ALIAS" ] && unset SIFT_KEY_ALIAS
          [ -z "$SIFT_KEY_PASSWORD" ] && unset SIFT_KEY_PASSWORD
          gradle --no-daemon :app:assembleOfflineRelease :app:assembleSelfhostedRelease
          mkdir -p out
          cp app/build/outputs/apk/offline/release/*.apk out/Sift-offline.apk
          cp app/build/outputs/apk/selfhosted/release/*.apk out/Sift-selfhosted.apk

      - name: Verify offline APK has no INTERNET permission
        run: |
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt2
          $AAPT dump permissions out/Sift-offline.apk | tee /dev/stderr | grep -q "android.permission.INTERNET" \
            && { echo "::error::Offline APK requests INTERNET"; exit 1; } || echo "OK: offline APK has no network permission"

      - uses: actions/upload-artifact@v4
        with:
          name: Sift-apks
          path: out/*.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sift build ${{ github.run_number }}
          files: out/*.apk
