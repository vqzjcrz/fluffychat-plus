# Builds the FluffyChat+ APK on every push to the fluffychat-plus branch and
# publishes it as a GitHub release (tag fluffychat-plus-<run number>).
name: Build FluffyChat+ APK

on:
  push:
    branches: [fluffychat-plus]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free_up_space
      # Private-repo runners have about 7 GB of RAM, which the Android build
      # (Gradle, R8, Dart and Rust compiles) can run out of. Add swap.
      - name: Add swap
        continue-on-error: true
        run: |
          sudo fallocate -l 8G /swapfile-build
          sudo chmod 600 /swapfile-build
          sudo mkswap /swapfile-build
          sudo swapon /swapfile-build
          free -h
          df -h /
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      # Builds are signed with your key from the repository secrets, so new
      # builds install as updates. Without the secrets, a throwaway key is
      # made for this build only (you'd have to uninstall to update).
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FLUFFYCHAT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FLUFFYCHAT_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/fluffychat-plus.p12
            echo "SIGNING_NOTE=Signed with your FluffyChat+ key." >> "$GITHUB_ENV"
          else
            echo "::warning::No FLUFFYCHAT_KEYSTORE_* secrets, signing with a one-off key."
            KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
            keytool -genkeypair -keystore android/fluffychat-plus.p12 -storetype PKCS12 \
              -alias plus -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=FluffyChat Plus temporary"
            echo "SIGNING_NOTE=Signed with a one-off key: uninstall the previous FluffyChat+ before installing this build." >> "$GITHUB_ENV"
          fi
          cat > android/key.properties <<EOF
          storeFile=../fluffychat-plus.p12
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEYSTORE_PASSWORD}
          keyAlias=plus
          EOF
      - run: flutter pub get
      - name: Build APK
        run: |
          set -o pipefail
          BASE=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          flutter build apk --release --target-platform android-arm64 --build-number=$((BASE * 1000 + ${{ github.run_number }})) 2>&1 | tee build.log
          cp build/app/outputs/flutter-apk/app-release.apk fluffychat-plus.apk
      # On failure, the errors go to the ci-logs branch so they can be read
      # without opening the Actions page.
      - name: Publish build errors
        if: failure()
        run: |
          {
            echo "Run ${{ github.run_number }} for ${{ github.sha }}"
            if [ -f build.log ]; then
              echo "== Error lines =="
              grep -nE "Error:|error:|^e: |FAILURE|What went wrong|Exception" build.log | head -200 || true
              echo "== Last 250 lines =="
              tail -250 build.log
            else
              echo "The build step didn't run; an earlier step failed."
            fi
          } > build-errors.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf --cached . > /dev/null
          git add -f build-errors.txt
          git commit -m "Build errors for run ${{ github.run_number }}"
          git push -f origin ci-logs
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: fluffychat-plus-apk
          path: fluffychat-plus.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fluffychat-plus-${{ github.run_number }}
          name: FluffyChat+ build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Built from ${{ github.sha }}.
            ${{ env.SIGNING_NOTE }}
          files: fluffychat-plus.apk
